# team.conf - who uses the 3ncryp+3d cluster and how they get in.
# Read by create_cluster.sh, tools/make-team-secrets.sh, node/team-setup.sh
# and laptop/setup-laptop.ps1. Plain KEY=VALUE (bash-sourceable).
# Public information only: no keys or passwords belong in this file.

# Names ---------------------------------------------------------------------
CLUSTER_NAME="3ncryp+3d"        # banner, prompt, reports ("+" is fine here)
HOST_PREFIX="3ncryp3d"          # hostnames: no "+" allowed in hostnames
# Fixed hardware role -> short name. Hostname = HOST_PREFIX-short name.
# The old names (node1/2/3) stay as aliases so existing scripts keep working.
NODE_ALIASES="node1=c1 node2=c2 node3=head"

# Accounts ------------------------------------------------------------------
TEAM_GROUP="team"
TEAM_GID=1100
# yes = sudo never asks for a password (decided 2026-11-21: login is
# key-only, so the password would only slow us down). no = sudo asks for a
# password, which each user must then set from the iLO console as ubuntu.
SUDO_NOPASSWD=yes

# One line per person:  user  uid  sudo(yes/no)  vpn-address
# The uid must be the same on every node (NFS v3 matches files by number).
TEAM_USERS="
saxs    1001  yes  10.99.0.11
swaetc  1002  yes  10.99.0.12
ole     1003  yes  10.99.0.13
rendi   1004  yes  10.99.0.14
"

# Internal node-to-node keys only work from these source addresses: the
# direct cables. A copied internal key is useless from the venue network.
INTERNAL_KEY_FROM="10.0.0.0/16,127.0.0.1,::1"

# Way in from the venue network (head node only) ----------------------------
WG_ENABLE=yes                   # WireGuard VPN on the head node
WG_PORT=51820                   # UDP port on the venue uplink
WG_HEAD_ADDR="10.99.0.1/24"     # head node's address inside the VPN
# yes = SSH also accepted directly on the venue port (keys only, fail2ban),
# as a backup if the VPN breaks. no = SSH only through the VPN.
SSH_ON_UPLINK=yes
FAIL2BAN=yes                    # ban IPs after repeated failed SSH logins
# Announce the head as <hostname>.local on the venue network (mDNS), so
# laptops find it without knowing its DHCP address. Publishes the name only.
MDNS=yes
