# bios-profile.conf - BIOS settings pushed to all three DL325 Gen11 servers
# through iLO (Redfish) by laptop/bios-profile.ps1.
#
# Names and values are HPE's Redfish identifiers (iLO 6 BIOS resource
# definitions, v1.62). The script checks every line against the server's own
# attribute registry first and SKIPS (with a warning) any name or value that
# server doesn't offer, so a wrong guess here never reaches the BIOS.
#
# Why two passes: picking a Workload Profile sets ~20 dependent options and
# locks them. PowerRegulator and MinProcIdlePower can only be changed when the
# profile is "Custom". So: pass 1 applies the HPC profile and reboots; pass 2
# switches to Custom (which keeps the HPC values) and adds our overrides.
#
# Format:  Name = Value   # comment.  Blank lines and comments are ignored.
# Every change is recorded under results/bios/ for reproducibility.

[pass1]
WorkloadProfile = HighPerformanceCompute(HPC)

[pass2]
WorkloadProfile = Custom
# CPU: never slow down or sleep to save power
PowerRegulator = StaticHighPerf
MinProcIdlePower = NoCStates
CollabPowerControl = Disabled
ProcAMDBoost = Enabled
# each chip runs as fast as its own silicon allows (vs identical-but-slower)
DeterminismControl = DeterminismCtrlManual
PerformanceDeterminism = PowerDeterministic
# EPYC 9135: configurable 200-240 W. 240 W = longest boost. Check the power cap
# rule with the organisers first; set Auto to go back to the default.
PackagePowerLimitControlMode = Manual
PackagePowerLimitValue = 240
# memory and fabric: steady, fastest state (HPCG, WRF and llama.cpp are
# memory-bound on our 2-of-12 channels)
DataFabricCStateEnable = Disabled
InfinityFabricPstate = P0
AmdMemPStates = Disabled
# Auto = the fastest speed the DIMMs and CPU support (DDR5-6400 expected)
MaxMemBusFreqMHz = Auto
NumaMemoryDomainsPerSocket = OneMemoryDomainPerSocket
# fans: cooler chips boost longer. MaxCooling is louder still.
ThermalConfig = IncreasedCooling
# not used on a bare-metal cluster
Sriov = Disabled
ProcAmdIoVt = Disabled
AmdDmaRemapping = Disabled
# SMT: test both on Sunday night (HPL is sometimes faster with it off)
ProcSMT = Enabled
