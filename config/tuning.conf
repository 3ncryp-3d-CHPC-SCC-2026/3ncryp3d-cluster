# tuning.conf - Linux performance settings for every node, applied by
# perf-mode (node/perf-mode). Read on every boot and every `perf-mode` run.
#
#   perf-mode status        what is in effect now, item by item (OK / DIFF)
#   sudo perf-mode performance | default
#   sudo perf-mode --all performance   all three nodes
#
# "default" puts back what Ubuntu does out of the box, so a run can be
# reproduced in either mode. Items marked [reboot] only take effect after a
# reboot; perf-mode status says when one is pending.

# Mode the nodes come up in after every boot: performance | default
PERF_MODE_DEFAULT=performance

# CPU ------------------------------------------------------------------------
CPU_GOVERNOR=performance          # cpufreq governor on every core
CPU_EPP=performance               # amd-pstate energy/performance preference
CPU_BOOST=1                       # 1 = boost on (where the driver exposes it)
# Deepest idle state allowed: 0 = poll only, 1 = C1 (fast wake), 99 = no limit.
# BIOS already disables C-states (bios-profile.conf); this covers the OS side.
CPU_MAX_IDLE_STATE=1
NMI_WATCHDOG=0                    # frees a CPU perf counter, removes a timer tick

# [reboot] Kernel command line. mitigations=off removes CPU side-channel
# defences: a few % faster, more on network and disk heavy runs. Only our own
# code runs here; set MITIGATIONS=on to keep them.
MITIGATIONS=off
KERNEL_CMDLINE_EXTRA=""           # anything else, e.g. "amd_pstate=active"

# Memory ---------------------------------------------------------------------
THP_ENABLED=always                # transparent huge pages: always | madvise | never
THP_DEFRAG=madvise                # "always" can stall a run while it defragments
NUMA_BALANCING=0                  # kernel moving pages between NUMA nodes: off
SWAPPINESS=10

# Background noise: stopped and disabled in performance mode, put back in
# default mode. An apt upgrade or a weekly fstrim mid-benchmark ruins a run.
QUIET_UNITS="unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer
  snapd.service snapd.socket snapd.seeded.service motd-news.timer fwupd-refresh.timer
  man-db.timer e2scrub_all.timer fstrim.timer update-notifier-download.timer
  update-notifier-motd.timer ua-timer.timer ModemManager.service packagekit.service"

# Network (mesh links only: the interfaces with 10.0.x.x addresses) ---------
NET_RING_MAX=1                    # NIC rx/tx rings to their hardware maximum
NET_RMEM_MAX=268435456            # socket buffer ceilings for 10G TCP (256 MB)
NET_WMEM_MAX=268435456
NET_TCP_RMEM="4096 131072 134217728"
NET_TCP_WMEM="4096 131072 134217728"
NET_BACKLOG=250000
# irqbalance stays on: pinning NIC interrupts by hand only helps if measured.
IRQBALANCE=keep                   # keep | off

# Storage --------------------------------------------------------------------
SSD_SCHEDULER=none                # non-rotational disks (SSD RAID 0)
HDD_SCHEDULER=mq-deadline         # rotational disks (HDD RAID 0, OS)
READ_AHEAD_KB=4096                # on the disk behind /mnt/shared (head)
NFSD_THREADS=32                   # NFS server threads on the head (Ubuntu: 8)

# Limits for every login (MPI and HPL need these) ----------------------------
LIMIT_MEMLOCK=unlimited
LIMIT_STACK=unlimited
LIMIT_NOFILE=1048576
